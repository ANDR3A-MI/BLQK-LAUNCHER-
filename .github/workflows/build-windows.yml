name: Build BLQK Launcher (Windows)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Estrai il progetto
        shell: pwsh
        run: Expand-Archive -Path blqk-launcher.zip -DestinationPath . -Force

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: npm install

      - name: Crea installer Windows
        run: npm run dist -- --publish never

      - name: Carica installer
        uses: actions/upload-artifact@v4
        with:
          name: BLQK-Launcher-Windows
          path: dist/*.exe
          retention-days: 30

      - name: Allega alla release (solo se è un tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
